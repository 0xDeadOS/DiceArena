name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dicebound
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dicebound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dicebound -d dicebound_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dicebound:ci-only-password@localhost:5432/dicebound_test
      TEST_DATABASE_URL: postgresql://dicebound:ci-only-password@localhost:5432/dicebound_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
